name: Vinted-bevakning

on:
  schedule:
    - cron: "17 * * * *"  # reserv; cron-job.org startar körningarna var 10:e minut
  workflow_dispatch:
    inputs:
      test:
        description: "Skicka en testnotis per sökord"
        type: boolean
        default: false
      silent:
        description: "Spara nya annonser som sedda utan att skicka notiser"
        type: boolean
        default: false
      only:
        description: "Bara dessa sökningar, kommaseparerade (tomt = alla)"
        type: string
        default: ""
      skip:
        description: "Hoppa över dessa (id eller titel, separerade med |)"
        type: string
        default: ""
      recent_minutes:
        description: "Skicka notiser för annonser från senaste X minuterna (0 = av)"
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: vinted
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # alltid senaste seen.json, även om körningen fick vänta i kö
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Kolla Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ONLY: ${{ inputs.only }}
          SKIP: ${{ inputs.skip }}
          SILENT: ${{ inputs.silent && '1' || '' }}
          DEBUG_KEYS: ${{ inputs.test && '1' || '' }}
        run: |
          if [ "${{ inputs.recent_minutes || 0 }}" != "0" ]; then
            python vinted_watch.py --recent ${{ inputs.recent_minutes }}
          else
            python vinted_watch.py ${{ inputs.test && '--test' || '' }}
          fi
      - name: Spara sedda annonser
        if: ${{ always() }}
        run: |
          git config user.name "vinted-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "uppdatera seen.json"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
