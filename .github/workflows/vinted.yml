name: Vinted-bevakning

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Skicka en testnotis per sökord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vinted
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Kolla Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG_KEYS: ${{ inputs.test && '1' || '' }}
        run: python vinted_watch.py ${{ inputs.test && '--test' || '' }}
      - name: Spara sedda annonser
        run: |
          git config user.name "vinted-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "uppdatera seen.json"
          git push
