name: Vinted-bevakning

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Skicka en testnotis per sökord"
        type: boolean
        default: false
      recent_minutes:
        description: "Skicka notiser för annonser från senaste X minuterna (0 = av)"
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: vinted
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Kolla Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG_KEYS: ${{ inputs.test && '1' || '' }}
        run: |
          if [ "${{ inputs.recent_minutes || 0 }}" != "0" ]; then
            python vinted_watch.py --recent ${{ inputs.recent_minutes }}
          else
            python vinted_watch.py ${{ inputs.test && '--test' || '' }}
          fi
      - name: Spara sedda annonser
        if: ${{ !inputs.recent_minutes }}
        run: |
          git config user.name "vinted-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "uppdatera seen.json"
          git push
